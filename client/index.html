<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1B2D" />
    <meta name="description" content="Pay for parking and check your time." />
    <!-- Both products are served from this one HTML file, so the static title
         and description are the WHITE-LABEL ones: a guest who views source on
         the parking page must not find the staff app's name there. In
         production Express rewrites these for staff routes before sending
         (see server/index.js); the router sets them on navigation too. -->
    <title>Guest Parking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
