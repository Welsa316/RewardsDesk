<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1B2D" />
    <meta name="description" content="Pay for parking and check your time." />
    <title>Guest Parking</title>
    <script>
      // Both products are served from this one HTML file, so the static title
      // and description are the WHITE-LABEL ones: a guest who views source on
      // the parking page must not find the staff app's name there. Staff pages
      // set their own chrome here, before first paint, so neither side flashes.
      (function () {
        var p = location.pathname;
        if (p === '/park' || p.indexOf('/park/') === 0) return;
        document.title = 'RewardsDesk';
        var d = document.querySelector('meta[name="description"]');
        if (d) d.setAttribute('content', 'Front-desk rewards intake & enrollment tracking.');
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
